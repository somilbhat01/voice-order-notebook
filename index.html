<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Order Notebook & Khata</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { font-family: -apple-system, system-ui, sans-serif; background: #f6f5f0; color: #1a1a1a; margin: 0; }
  main { max-width: 740px; margin: 0 auto; padding: 32px 20px 80px; }

  /* Header */
  .header-tag { display: inline-block; font-size: 11px; font-weight: 700; color: #d97706; background: #fef3c7; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
  h1 { margin: 0 0 6px; font-size: 28px; font-weight: 800; }
  .sub { color: #666; margin: 0 0 24px; font-size: 15px; }

  /* Record bar */
  .record-bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 8px; }
  #mic {
    font-size: 15px; padding: 13px 22px; border: 0; border-radius: 12px;
    background: #1a1a1a; color: #fff; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    font-weight: 600; transition: background .15s, transform .05s;
  }
  #mic:hover { background: #333; }
  #mic:active { transform: scale(0.98); }
  #mic.rec { background: #dc2626; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .75; } }

  #status { color: #666; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .spinner {
    width: 15px; height: 15px; border: 2px solid #ccc;
    border-top-color: #1a1a1a; border-radius: 50%;
    animation: spin .6s linear infinite; flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Card */
  .card { background: #fff; border-radius: 16px; padding: 20px; margin-top: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.05); border: 1px solid #ebe8e1; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: #888; margin: 0 0 6px; font-weight: 700; }

  /* Transcript */
  #transcript { font-size: 15px; margin: 0 0 16px; line-height: 1.5; color: #2d3748; background: #fafaf7; padding: 10px 14px; border-radius: 10px; border-left: 3px solid #d97706; }

  /* Inputs grid */
  .meta-grid { display: grid; grid-template-columns: 2fr 1fr 1.3fr; gap: 12px; margin-bottom: 16px; }
  @media (max-width: 600px) { .meta-grid { grid-template-columns: 1fr; } }
  .input-group label { display: block; font-size: 11px; text-transform: uppercase; color: #888; font-weight: 700; margin-bottom: 4px; }
  .input-group input, .input-group select {
    width: 100%; padding: 9px 12px; border: 1.5px solid #e2e0d8; border-radius: 9px;
    font-size: 14px; background: #fff; color: #1a1a1a; outline: none;
  }
  .input-group input:focus, .input-group select:focus { border-color: #1a1a1a; }

  /* Table */
  table { width: 100%; border-collapse: collapse; margin-bottom: 6px; }
  th { text-align: left; font-size: 11px; color: #999; font-weight: 700; padding: 4px 6px; text-transform: uppercase; letter-spacing: .05em; }
  td { padding: 3px 4px; }
  td input {
    width: 100%; padding: 8px 10px; border: 1.5px solid #e5e3dc; border-radius: 8px;
    font-size: 14px; outline: none; background: #fafaf7;
  }
  td input:focus { border-color: #1a1a1a; background: #fff; }
  td.qty-cell  { width: 72px; }
  td.unit-cell { width: 90px; }
  td.del-cell  { width: 34px; text-align: center; }

  .del-row {
    background: none; border: none; cursor: pointer; font-size: 18px;
    color: #bbb; line-height: 1; padding: 2px 4px; border-radius: 6px;
  }
  .del-row:hover { color: #dc2626; }

  #add-row {
    background: none; border: 1.5px dashed #ccc; color: #666; cursor: pointer;
    font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 8px; margin-top: 8px; width: 100%;
  }
  #add-row:hover { border-color: #444; color: #111; }

  /* Action buttons */
  .actions { display: flex; gap: 10px; margin-top: 18px; }
  .btn-save {
    font-size: 15px; padding: 12px 20px; border: 0; border-radius: 10px;
    background: #1a1a1a; color: #fff; cursor: pointer; font-weight: 700; flex: 1;
  }
  .btn-save:hover { background: #333; }
  .btn-wa {
    font-size: 15px; padding: 12px 20px; border: 0; border-radius: 10px;
    background: #25D366; color: #fff; cursor: pointer; font-weight: 700; flex: 1;
  }
  .btn-wa:hover { background: #1eb954; }

  /* ── Stats Dashboard ── */
  .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 28px 0 16px; }
  .stat-card { background: #fff; border: 1px solid #ebe8e1; border-radius: 12px; padding: 12px 14px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .stat-card .stat-title { font-size: 11px; text-transform: uppercase; color: #888; font-weight: 700; margin-bottom: 2px; }
  .stat-card .stat-val { font-size: 20px; font-weight: 800; color: #1a1a1a; }
  .stat-card.alert .stat-val { color: #dc2626; }

  /* Filter pills */
  .filter-bar { display: flex; gap: 8px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 4px; }
  .filter-btn {
    border: 1px solid #dcdad0; background: #fff; color: #666; font-size: 13px; font-weight: 600;
    padding: 6px 14px; border-radius: 20px; cursor: pointer; white-space: nowrap; transition: all .15s;
  }
  .filter-btn.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

  /* ── Minimalist Order Card ── */
  .order-item-card {
    background: #fff; border-radius: 14px; border: 1px solid #ebe8e1;
    padding: 16px 18px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.03);
    transition: all .15s;
  }
  .order-item-card.is-delivered { border-left: 4px solid #16a34a; }
  .order-item-card.is-pending   { border-left: 4px solid #d97706; }

  .order-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .order-cust { font-size: 17px; font-weight: 800; color: #111; }
  .order-date { font-size: 12px; color: #999; margin-top: 1px; }

  /* Interactive Pill Badges */
  .pills-group { display: flex; gap: 6px; }
  .pill-toggle {
    display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700;
    padding: 5px 11px; border-radius: 20px; cursor: pointer; border: 1px solid transparent;
    user-select: none; transition: transform .08s, opacity .15s;
  }
  .pill-toggle:hover { opacity: .88; transform: translateY(-1px); }
  .pill-toggle:active { transform: translateY(0); }

  .pill-pending   { background: #fef3c7; color: #b45309; border-color: #fde68a; }
  .pill-delivered { background: #dcfce7; color: #15803d; border-color: #bbf7d0; }
  .pill-udhaar    { background: #fee2e2; color: #b91c1c; border-color: #fecaca; }
  .pill-paid      { background: #e0e7ff; color: #3730a3; border-color: #c7d2fe; }

  .order-lines { margin: 8px 0 14px; padding-left: 18px; color: #333; font-size: 14px; line-height: 1.8; }
  .order-when-tag { color: #888; font-size: 12px; font-style: italic; }

  /* Clean Footer */
  .order-footer {
    display: flex; justify-content: space-between; align-items: center;
    border-top: 1px solid #f2f0ea; padding-top: 10px;
  }
  .order-amount-text { font-size: 14px; color: #444; font-weight: 600; }
  .order-amount-val  { font-weight: 800; font-size: 16px; color: #111; }

  .footer-actions { display: flex; align-items: center; gap: 8px; }
  .btn-wa-pill {
    background: #25D366; color: #fff; border: 0; font-size: 12px; font-weight: 700;
    padding: 6px 14px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
    transition: background .15s;
  }
  .btn-wa-pill:hover { background: #1eb954; }

  .btn-del-icon {
    background: none; border: none; cursor: pointer; font-size: 16px; color: #aaa;
    padding: 4px 6px; border-radius: 6px; transition: color .15s;
  }
  .btn-del-icon:hover { color: #dc2626; }

  .empty-box { text-align: center; color: #999; padding: 28px 0; font-size: 15px; }
</style>
</head>
<body>
<main>
  <span class="header-tag">Kirana Voice Assistant & Digital Khata</span>
  <h1>🎙️ Voice Order Notebook</h1>
  <p class="sub">Speak orders in Hindi or Hinglish. Automatically track Pre-orders, Deliveries & Udhaar Khata.</p>

  <div class="record-bar">
    <button id="mic">🎤 Start recording</button>
    <div id="status"></div>
  </div>

  <!-- Active Order Review Card -->
  <section id="result" class="card" hidden>
    <p class="label">Voice Transcript (Gnani Prisma v2.5)</p>
    <div id="transcript"></div>

    <div class="meta-grid">
      <div class="input-group">
        <label>Customer Name (ग्राहक)</label>
        <input id="customer" placeholder="e.g. शर्मा जी">
      </div>
      <div class="input-group">
        <label>Total Bill ₹ (रकम)</label>
        <input id="amount" type="number" placeholder="0">
      </div>
      <div class="input-group">
        <label>Payment (पेमेंट)</label>
        <select id="payment-mode">
          <option value="udhaar">📕 Udhaar / Unpaid (उधार बाकी)</option>
          <option value="cash">💵 Paid via Cash (नकद)</option>
          <option value="upi">📱 Paid via UPI (GPay/PhonePe)</option>
        </select>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Item</th>
          <th class="qty-cell">Qty</th>
          <th class="unit-cell">Unit</th>
          <th>When (डिलीवरी)</th>
          <th class="del-cell"></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

    <button id="add-row">+ Add item manually</button>

    <div class="actions">
      <button class="btn-save" id="save">💾 Save to Notebook</button>
      <button class="btn-wa" id="whatsapp">📲 WhatsApp Bill Slip</button>
    </div>
  </section>

  <!-- Digital Khata & Orders Register -->
  <div class="stats-bar">
    <div class="stat-card">
      <div class="stat-title">Total Orders</div>
      <div class="stat-val" id="stat-total">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">Pending Delivery</div>
      <div class="stat-val" id="stat-pending">0</div>
    </div>
    <div class="stat-card alert">
      <div class="stat-title">Total Udhaar (बाकी)</div>
      <div class="stat-val" id="stat-udhaar">₹0</div>
    </div>
  </div>

  <div class="filter-bar">
    <button class="filter-btn active" data-filter="all">All Orders (सभी)</button>
    <button class="filter-btn" data-filter="pending">⏳ Pending Delivery (बाकी)</button>
    <button class="filter-btn" data-filter="unpaid">📕 Udhaar (उधार)</button>
    <button class="filter-btn" data-filter="completed">✅ Delivered (डिलीवर हो गए)</button>
  </div>

  <div id="orders-container"></div>
</main>

<script>
const mic = document.getElementById("mic");
const statusEl = document.getElementById("status");
const result = document.getElementById("result");
let recorder = null;
let chunks = [];
let allOrders = [];
let activeFilter = "all";

function esc(s) {
  return String(s || "")
    .replace(/&/g, "&amp;").replace(/"/g, "&quot;")
    .replace(/</g, "&lt;" ).replace(/>/g, "&gt;" );
}

function setStatus(msg, spinning) {
  statusEl.innerHTML = spinning
    ? '<span class="spinner"></span>' + esc(msg)
    : esc(msg);
}

/* ── In-Browser 16kHz WAV Encoder ── */
function encodeWav(samples, rate) {
  const buf = new ArrayBuffer(44 + samples.length * 2);
  const v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + samples.length * 2, true); w(8, "WAVE");
  w(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, "data"); v.setUint32(40, samples.length * 2, true);
  let off = 44;
  for (let i = 0; i < samples.length; i++, off += 2) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    v.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7fff, true);
  }
  return new Blob([buf], { type: "audio/wav" });
}

async function toWav(blob) {
  const arr = await blob.arrayBuffer();
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const decoded = await ctx.decodeAudioData(arr);
  const rate = 16000;
  const offline = new OfflineAudioContext(1, Math.ceil(decoded.duration * rate), rate);
  const src = offline.createBufferSource();
  src.buffer = decoded;
  src.connect(offline.destination);
  src.start();
  const rendered = await offline.startRendering();
  ctx.close();
  return encodeWav(rendered.getChannelData(0), rate);
}

/* ── Voice Recording Handler ── */
mic.onclick = async () => {
  if (recorder && recorder.state === "recording") { recorder.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recorder = new MediaRecorder(stream);
    chunks = [];
    recorder.ondataavailable = (e) => chunks.push(e.data);
    recorder.onstop = async () => {
      stream.getTracks().forEach((t) => t.stop());
      mic.textContent = "🎤 Start recording";
      mic.classList.remove("rec");
      await processAudio(new Blob(chunks, { type: recorder.mimeType }));
    };
    recorder.start();
    mic.textContent = "⏹ Stop recording";
    mic.classList.add("rec");
    setStatus("Listening... Speak in Hindi/Hinglish, then click Stop.");
  } catch (e) {
    setStatus("Microphone error: " + e.message);
  }
};

async function processAudio(blob) {
  try {
    setStatus("Transcribing with Gnani Prisma...", true);
    const wav = await toWav(blob);
    const res = await fetch("/api/order", { method: "POST", body: wav });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Server processing failed");
    showOrder(data);
    setStatus("Order parsed! Review details, payment & delivery, then save.");
  } catch (e) {
    setStatus("Error: " + e.message);
  }
}

/* ── Populate Active Order Grid ── */
function makeRow(it) {
  const tr = document.createElement("tr");
  tr.innerHTML =
    '<td><input value="' + esc(it.item)     + '" placeholder="Item name"></td>' +
    '<td class="qty-cell"><input value="'  + esc(it.quantity) + '" type="number" min="0.5" step="0.5"></td>' +
    '<td class="unit-cell"><input value="' + esc(it.unit)     + '"></td>' +
    '<td><input value="'                   + esc(it.when)     + '"></td>' +
    '<td class="del-cell"><button class="del-row" title="Remove">×</button></td>';
  tr.querySelector(".del-row").onclick = () => tr.remove();
  return tr;
}

function showOrder(data) {
  document.getElementById("transcript").textContent = data.transcript;
  document.getElementById("customer").value = data.customer || "";
  document.getElementById("amount").value = data.totalAmount || "";

  const pMode = document.getElementById("payment-mode");
  if (data.paymentMethod === "UPI") pMode.value = "upi";
  else if (data.paymentMethod === "Cash" || data.payment === "paid") pMode.value = "cash";
  else pMode.value = "udhaar";

  const rows = document.getElementById("rows");
  rows.innerHTML = "";
  (data.items || []).forEach((it) => rows.appendChild(makeRow(it)));
  result.hidden = false;
  result.scrollIntoView({ behavior: "smooth" });
}

document.getElementById("add-row").onclick = () => {
  document.getElementById("rows").appendChild(
    makeRow({ item: "", quantity: 1, unit: "pc", when: "Not specified" })
  );
};

function collectActiveOrder() {
  const items = [...document.querySelectorAll("#rows tr")].map((tr) => {
    const f = tr.querySelectorAll("input");
    return { item: f[0].value, quantity: Number(f[1].value) || 1, unit: f[2].value, when: f[3].value };
  });

  const pModeVal = document.getElementById("payment-mode").value;
  const isPaid = pModeVal !== "udhaar";
  const pMethod = pModeVal === "upi" ? "UPI" : (pModeVal === "cash" ? "Cash" : "Udhaar");

  return {
    customer: document.getElementById("customer").value || "Unknown",
    totalAmount: Number(document.getElementById("amount").value) || 0,
    payment: isPaid ? "paid" : "unpaid",
    paymentMethod: pMethod,
    status: "pending",
    transcript: document.getElementById("transcript").textContent,
    items,
  };
}

/* ── Save Order to Notebook ── */
document.getElementById("save").onclick = async () => {
  const body = collectActiveOrder();
  await fetch("/api/save", { method: "POST", body: JSON.stringify(body) });
  result.hidden = true;
  setStatus("✅ Saved to Notebook!");
  loadOrders();
};

/* ── WhatsApp Text Generator ── */
function formatWhatsAppText(order) {
  const dateStr = new Date(order.savedAt || Date.now()).toLocaleDateString("en-IN");
  const isPaid = order.payment === "paid";
  const payLabel = isPaid ? `✅ Paid (${order.paymentMethod || "Cash"})` : "⚠️ बाकी / उधार (Payment Pending)";
  const statusLabel = order.status === "delivered" ? "✅ Delivered (डिलीवर हो गया)" : "⏳ Pending Delivery (तैयार हो रहा है)";

  const lines = [
    "*🛍️ श्री किराना स्टोर (Order Slip)*",
    "-----------------------------",
    "*ग्राहक (Customer):* " + (order.customer || "Customer"),
    "*दिनांक (Date):* " + dateStr,
    "",
    "*सामान (Order Items):*",
  ];

  (order.items || []).forEach((it) => {
    const when = it.when && it.when !== "Not specified" ? " (" + it.when + ")" : "";
    lines.push("• " + it.quantity + " " + it.unit + " " + it.item + when);
  });

  lines.push("");
  if (order.totalAmount) {
    lines.push("*कुल बिल (Total):* ₹" + order.totalAmount);
  }
  lines.push("*पेमेंट:* " + payLabel);
  lines.push("*डिलीवरी स्थिति:* " + statusLabel);
  lines.push("-----------------------------");
  lines.push("_Order created via Voice Order Notebook · Powered by Gnani Prisma_");

  return encodeURIComponent(lines.join("\n"));
}

document.getElementById("whatsapp").onclick = () => {
  const order = collectActiveOrder();
  window.open("https://wa.me/?text=" + formatWhatsAppText(order), "_blank");
};

/* ── Khata Management API Calls ── */
async function updateOrder(id, updates) {
  await fetch("/api/order/update", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id, updates })
  });
  loadOrders();
}

async function deleteOrder(id) {
  if (!confirm("Are you sure you want to delete this order?")) return;
  await fetch("/api/order/delete", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id })
  });
  loadOrders();
}

/* ── Render Orders Register ── */
async function loadOrders() {
  const res = await fetch("/api/orders");
  allOrders = await res.json();
  renderDashboard();
}

function renderDashboard() {
  // Compute Stats
  const total = allOrders.length;
  const pending = allOrders.filter(o => o.status !== "delivered").length;
  const udhaar = allOrders
    .filter(o => o.payment === "unpaid")
    .reduce((sum, o) => sum + (Number(o.totalAmount) || 0), 0);

  document.getElementById("stat-total").textContent = total;
  document.getElementById("stat-pending").textContent = pending;
  document.getElementById("stat-udhaar").textContent = "₹" + udhaar.toLocaleString("en-IN");

  // Filter
  let filtered = allOrders;
  if (activeFilter === "pending") filtered = allOrders.filter(o => o.status !== "delivered");
  else if (activeFilter === "unpaid") filtered = allOrders.filter(o => o.payment === "unpaid");
  else if (activeFilter === "completed") filtered = allOrders.filter(o => o.status === "delivered");

  const container = document.getElementById("orders-container");
  if (!filtered.length) {
    container.innerHTML = '<div class="empty-box">No orders in this view.</div>';
    return;
  }

  container.innerHTML = filtered.map((o) => {
    const isDelivered = o.status === "delivered";
    const isPaid = o.payment === "paid";
    const cardClass = isDelivered ? "is-delivered" : "is-pending";

    const delClass = isDelivered ? "pill-delivered" : "pill-pending";
    const delText = isDelivered ? "✅ Delivered" : "⏳ Pending";
    const nextStatus = isDelivered ? "pending" : "delivered";

    const payClass = isPaid ? "pill-paid" : "pill-udhaar";
    const payText = isPaid
      ? `💰 Paid (${o.paymentMethod || "Cash"})`
      : `📕 ₹${o.totalAmount || 0} Udhaar`;
    const nextPayment = isPaid ? "unpaid" : "paid";
    const nextMethod = isPaid ? "Udhaar" : "Cash";

    return `
      <div class="order-item-card ${cardClass}">
        <div class="order-top">
          <div>
            <span class="order-cust">${esc(o.customer)}</span>
            <div class="order-date">${new Date(o.savedAt).toLocaleString("en-IN")}</div>
          </div>
          <div class="pills-group">
            <!-- 1-Tap Delivery Toggle Pill -->
            <span class="pill-toggle ${delClass}" onclick="updateOrder(${o.id}, { status: '${nextStatus}' })" title="Tap to toggle Delivery status">
              ${delText}
            </span>

            <!-- 1-Tap Payment Toggle Pill -->
            <span class="pill-toggle ${payClass}" onclick="updateOrder(${o.id}, { payment: '${nextPayment}', paymentMethod: '${nextMethod}' })" title="Tap to toggle Payment">
              ${payText}
            </span>
          </div>
        </div>

        <ul class="order-lines">
          ${(o.items || []).map(i => `
            <li>
              <b>${esc(i.quantity)} ${esc(i.unit)}</b> ${esc(i.item)}
              ${i.when && i.when !== "Not specified" ? `<span class="order-when-tag">— ${esc(i.when)}</span>` : ""}
            </li>
          `).join("")}
        </ul>

        <div class="order-footer">
          <div class="order-amount-text">
            ${o.totalAmount ? `Total: <span class="order-amount-val">₹${o.totalAmount}</span>` : `<span style="color:#999">No bill amount set</span>`}
          </div>

          <div class="footer-actions">
            <button class="btn-wa-pill" onclick="window.open('https://wa.me/?text=${formatWhatsAppText(o)}', '_blank')">📲 WhatsApp Slip</button>
            <button class="btn-del-icon" onclick="deleteOrder(${o.id})" title="Delete order">🗑️</button>
          </div>
        </div>
      </div>
    `;
  }).join("");
}

// Filter tabs logic
document.querySelectorAll(".filter-btn").forEach((btn) => {
  btn.onclick = () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeFilter = btn.dataset.filter;
    renderDashboard();
  };
});

loadOrders();
</script>
</body>
</html>
